services:
  keycloak:
    environment:
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_PROXY_HEADERS: xforwarded
    ports: []
    networks:
      - default
      - web

  backend:
    ports: []
    networks:
      - default
      - web

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL}
        NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM:-fsp}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-fsp-web}
    ports: []
    networks:
      - default
      - web

networks:
  web:
    external: true
    name: ${PROXY_NETWORK:-reverse-proxy_default}
