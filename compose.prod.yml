services:
  keycloak:
    environment:
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: https://fsp.any1key.ru/auth
      KC_PROXY_HEADERS: xforwarded
    ports: []
    networks:
      - default
      - web

  backend:
    ports: []
    networks:
      - default
      - web

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: https://fsp.any1key.ru
        NEXT_PUBLIC_KEYCLOAK_URL: https://fsp.any1key.ru/auth
        NEXT_PUBLIC_KEYCLOAK_REALM: fsp
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: fsp-web
    ports: []
    networks:
      - default
      - web

networks:
  web:
    external: true
    name: arm112-trainer_default
