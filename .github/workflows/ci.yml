name: CI

on:
  push:
    branches: ["main", "develop", "agent/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff check .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: |
          sed -i 's/CHANGE_ME_APP_DB_PASSWORD/ci-app-password/g' .env
          sed -i 's/CHANGE_ME_KEYCLOAK_DB_PASSWORD/ci-kc-db-password/g' .env
          sed -i 's/CHANGE_ME_KEYCLOAK_ADMIN_PASSWORD/ci-kc-admin-password/g' .env
      - run: docker compose config -q
