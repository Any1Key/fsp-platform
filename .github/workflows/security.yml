name: Security

on:
  pull_request:
  workflow_dispatch:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject obvious committed secrets
        run: |
          ! grep -RIE --exclude-dir=.git --exclude='*.example' \
            '(sk-[A-Za-z0-9_-]{20,}|TELEGRAM_BOT_TOKEN=.+|KEYCLOAK_ADMIN_PASSWORD=.+)' .
